# Render Blueprint - free tier deployment for the 832402226 calculator.
#
# One web service serves both the JSON API and the H5 client, so the browser
# never issues a cross origin request and a single URL is enough.
#
# The front-end is a zero-build static site: copy
# 832402226_calculator_frontend/src into 后端/src/web before deploying
# (see DEPLOYMENT.md), because Render's free plan allows one service.
#
# IMPORTANT - why there is no "cd" in the commands below:
#   This file lives in the back-end repository, and this repository IS the
#   deployed service. Render checks the repository out into the working
#   directory, so run.py, requirements.txt and src/ sit directly at the top:
#
#       <checkout>/run.py
#       <checkout>/requirements.txt
#       <checkout>/src/web/calculator.html
#
#   An earlier revision prefixed the commands with
#   "cd 832402226_calculator_backend", which assumed a folder of that name
#   existed inside the repository. It does not, so the build aborted with
#   "No such file or directory" and the service never started. Keep the
#   commands free of "cd" and verify with the folder listing above.
#
# Environment variables:
#   CALC_FRONTEND_DIR  directory that holds the static client (relative to the repo root)
#   CALC_CORS_ORIGIN   "*" keeps LAN and phone testing working
#   CALC_DEBUG         must stay "false" on a public deployment
#   PYTHON_VERSION     a stable interpreter version compatible with Flask

services:
  - type: web
    name: calculator-832402226
    runtime: python
    plan: free
    region: singapore
    branch: main
    # Explicit and equal to the default: documents that the repository root is
    # the application directory. "cd <repo-name>" is NOT needed here.
    rootDir: .
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: CALC_DEBUG
        value: "false"
      - key: CALC_CORS_ORIGIN
        value: "*"
      - key: CALC_FRONTEND_DIR
        value: src/web