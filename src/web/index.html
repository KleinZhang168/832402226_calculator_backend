<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#EDDBC7" />
    <meta name="robots" content="noindex" />
    <title>832402226 Calculator</title>
    <link rel="icon" href="data:," />

    <!--
      Entry page for the deployed service.

      The client's own entry point is calculator.html, which is what the local
      two-process setup opens. A cloud host that serves the page from the root
      path ("/") needs an index.html, so this file immediately forwards there.
      Without it, "/" returns the JSON endpoint list and the app does not
      register its static routes at all.

      Generated by deploy/sync-frontend.ps1 - do not edit by hand; edit the
      template in that script instead.
    -->
    <meta http-equiv="refresh" content="0; url=./calculator.html" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #EDDBC7;
        color: #4A3B32;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      a {
        color: #8C5A3C;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="note">Loading the calculator&hellip; / 正在打开计算器&hellip;</p>
      <p><a href="./calculator.html">Open the calculator / 打开计算器</a></p>
    </main>

    <!-- Belt and braces: the meta refresh handles browsers with scripting
         disabled, and this handles the (rare) case where the refresh is
         blocked. Both land on the same URL. -->
    <script>
      window.location.replace('./calculator.html');
    </script>
  </body>
</html>
